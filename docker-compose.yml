
x-server-template: &server-template
    build:
        context: ./
        dockerfile: ./Dockerfile
        args:
            BASE_IMAGE_TAG: $BASE_IMAGE_TAG
            DEVELOP_DEPENDENCIES: $DEVELOP_DEPENDENCIES
            PYTHONBREAKPOINT: import ipdb;ipdb.set_trace
    volumes:
        - .:/app
    depends_on:
        postgres:
            condition: service_healthy
        clickhouse:
            condition: service_healthy
        redis:
            condition: service_healthy
        kafka:
            condition: service_healthy

services:
    server:
        <<: *server-template
        command: python manage.py runserver
        ports:
            - 8000:8000

    worker:
        <<: *server-template
        command: python manage.py runworker --processes 2 --threads 20

    scheduler:
        <<: *server-template
        command: python manage.py runscheduler

    postgres:
        image: postgres:17.6-alpine
        ports:
            - 5432:5432
        environment:
            POSTGRES_DB: postgres_db
            POSTGRES_USER: postgres_db_user
            POSTGRES_PASSWORD: postgres_db_passwword
        volumes:
            - pg-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres_db_user -d postgres_db"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    clickhouse-keeper:

        image: clickhouse/clickhouse-keeper:26.8-alpine
        ports:
            - 9181:9181
        volumes:
            - ./clickhouse/keeper_config.d:/etc/clickhouse-keeper/keeper_config.d
            - keeper-data:/var/lib/clickhouse
            - keeper-extra:/var/lib/clickhouse-keeper
        healthcheck:
            test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 9181 | grep -q imok"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    clickhouse:
        image: clickhouse/clickhouse-server:26.8-alpine
        ports:
            - 8123:8123
        environment:
            CLICKHOUSE_DB: clickhouse_db
            CLICKHOUSE_USER: clickhouse_db_user
            CLICKHOUSE_PASSWORD: clickhouse_db_passwword
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        volumes:
            - ./clickhouse/config.d:/etc/clickhouse-server/config.d
            - ch-data:/var/lib/clickhouse
        depends_on:
            clickhouse-keeper:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
            interval: 5s
            timeout: 5s
            retries: 24
            start_period: 15s

    redis:
        image: redis/redis-stack:7.2.0-v13
        ports:
            - 6379:6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s

    kafka-ui:
        image: kafbat/kafka-ui:d285a69
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            - KAFKA_CLUSTERS_0_NAME=local
            - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
            - KAFKA_CLUSTERS_0_ZOOKEEPER=
        ports:
            - 8080:8080

    kafka:
        image: bitnamilegacy/kafka:4.0.0
        volumes:
            - kafka-data:/bitnami/kafka
        environment:
            - KAFKA_CFG_NODE_ID=0
            - KAFKA_CFG_PROCESS_ROLES=controller,broker
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
            - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
        healthcheck:
            test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 18
            start_period: 20s

volumes:
    pg-data:
    ch-data:
    keeper-data:
    keeper-extra:
    kafka-data:
