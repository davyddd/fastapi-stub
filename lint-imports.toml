[tool.importlinter]
root_packages = [
    "app",
]
include_external_packages = true


[[tool.importlinter.contracts]]
name = "Context independence (contexts must not import from each other)"
type = "independence"
modules = [
    "app.probe_context",
]
ignore_imports = [
     "**.infrastructure.** -> **",
]


[[tool.importlinter.contracts]]
name = "Domain layer purity (domain must not import from infrastructure libraries)"
type = "forbidden"
source_modules = [
    "app.probe_context",
]
# `ddredis` and `ddkafka` are not listed: `KafkaConsumerMaker` with `RedisLock` is allowed in applications,
# see docs/conventions/IMPORTS.md
forbidden_modules = [
    "fastapi",
    "dramatiq",
    "apscheduler",
    "httpx",
    "sentry_sdk",
    "ddsql",
    "sqlmodel",
    "sqlalchemy",
    "clickhouse_connect",
    "clickhouse_sqlalchemy",
    "redis",
    "aiokafka",
    "aerospike_native",
]
ignore_imports = [
    "**.infrastructure.** -> **",
]


[[tool.importlinter.contracts]]
name = "Layers contract"
type = "layers"
containers = [
    "app.probe_context",
]
layers = [
    "infrastructure.ports",
    "applications",
    "(infrastructure.repositories) | (infrastructure.adapters)",
    "(services)",
    "(domains)",
]
ignore_imports = [
]
