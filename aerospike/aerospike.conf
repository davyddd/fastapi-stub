# Local single-node Aerospike for docker-compose, passed to asd with `--config-file` (the image
# regenerates its own /etc/aerospike/aerospike.conf from a template on every start, so a mounted
# file there would be overwritten). default-ttl 0: records never expire unless a write asks for a
# TTL; nsup must run for a write with a TTL to be accepted (it is rejected while nsup-period is 0).

service {
    cluster-name fastapi-stub-local
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }

    heartbeat {
        mode mesh
        address local
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        address local
        port 3001
    }
}

namespace application_db {
    replication-factor 1
    default-ttl 0
    nsup-period 120

    storage-engine device {
        file /opt/aerospike/data/application_db.dat
        filesize 4G
        read-page-cache true
    }
}
